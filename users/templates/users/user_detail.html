{% extends 'mailing/base.html '%}
{% block title %}Информация о пользователе{% endblock %}
{% block content %}
<main class="container">
  <div class="d-flex align-items-center p-3 my-3 text-white bg-purple rounded shadow-sm" style="background-color: #6A5ACD;">
    <img class="me-3" src="/media/mailing/images/person.svg" alt="" width="48" height="38">
    <div class="lh-1">
      <h2 class="mb-0 text-white lh-1">Пользователь</h2>
      <small>пользователь</small>
    </div>
  </div>

  <div class="my-3 p-3 bg-body rounded shadow-sm">
    <h6 class="border-bottom pb-2 mb-0">Информация о пользователе</h6>

    <div class="d-flex text-body-secondary pt-3">
      <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32"  role="img" aria-label="Placeholder: 32x32" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#6f42c1"/><text x="50%" y="50%" fill="#6f42c1" dy=".3em">32x32</text></svg>
      <p class="pb-3 mb-0 small lh-sm border-bottom">
        <strong class="d-block text-gray-dark">{{user.email}}</strong>
      </p>
    </div>

    <small class="d-block text-end mt-3">
        {% if perms.user.block_users %}
        <form method="post" action="{% url 'users:user_block' user.id %}" style="display: inline;">
            {% csrf_token %}
               <button type="submit" style="border: none; background: none; padding: 0; cursor: pointer;" class="image-button"><a class="btn btn-outline-danger"  role="button">Заблокировать пользователя</a>
               </button>
        </form>
      <a href="{% url 'users:user_list' %}">К списку пользователей</a>
        {% endif %}
    </small>
  </div>
{% endblock %}
