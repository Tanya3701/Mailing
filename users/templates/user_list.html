{% extends 'mailing/base.html '%}
{% block title %}Recipient_list{% endblock %}
{% block content %}
<main class="container">
  <div class="d-flex align-items-center p-3 my-3 text-white bg-purple rounded shadow-sm" style="background-color: #6A5ACD;">
    <img class="me-3" src="/media/mailing/images/people.svg" alt="" width="48" height="38">
    <div class="lh-1">
      <h2 class="mb-0 text-white lh-1">Пользователи</h2>
      <small>Список пользователей</small>
    </div>
  </div>

  <div class="my-3 p-3 bg-body rounded shadow-sm">
      <a href="{% url 'users:login' %}" class="link-primary link-offset-2" >Добавить пользователя</a>
    {% for user in users %}
    <div class="d-flex text-body-secondary pt-4">
      <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32"  role="img" aria-label="Placeholder: 32x32" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#6f42c1"/><text x="50%" y="50%" fill="#6f42c1" dy=".3em">32x32</text></svg>
      <p class="pb-3 mb-0 small lh-sm border-bottom">
        <strong class="d-block text-gray-dark">{{user.email}}</strong>
         <strong><a href="{% url 'users:user_detail' user.pk %}" class="link-success">Подробнее</a></strong>
      </p>
    </div>
    {% endfor %}

  </div>
{% endblock %}
