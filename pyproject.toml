[project]
name = "mailing"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.33.0,<3.0.0)",
    "django (==4.2.2)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "charset-normalizer (>=3.4.7,<4.0.0)",
    "click (>=8.3.2,<9.0.0)",
    "librt (>=0.9.0,<0.10.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "platformdirs (>=4.9.6,<5.0.0)",
    "tzdata (>=2026.1,<2027.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "ipython (>=9.14.1,<10.0.0)",
    "redis (==4.3.4)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
lint = [
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
ignore_missing_imports = true

[tool.black]
line-lenght = 119
exclude = 'git'

[tool.isort]
line_length = 119