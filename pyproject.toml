[project]
name = "mailing"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.33.0,<3.0.0)",
    "django (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
lint = [
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
ignore_missing_imports = true

[tool.black]
line-lenght = 119
exclude = 'git'

[tool.isort]
line_length = 119