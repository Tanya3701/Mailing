{% extends 'mailing/base.html '%}
{% block title %}Сообщение{% endblock %}
{% block content %}
<main class="container">
  <div class="d-flex align-items-center p-3 my-3 text-white bg-purple rounded shadow-sm" style="background-color: #6A5ACD;">
    <img class="me-3" src="/media/mailing/images/message.svg" alt="" width="48" height="38">
    <div class="lh-1">
      <h2 class="mb-0 text-white lh-1">Сообщения</h2>
      <small>Сообщение №-{{message.id}}</small>
    </div>
  </div>

  <div class="my-3 p-3 bg-body rounded shadow-sm">
    <h6 class="border-bottom pb-2 mb-0">Recent updates</h6>

    <div class="d-flex text-body-secondary pt-3">
      <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32"  role="img" aria-label="Placeholder: 32x32" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#007bff"/><text x="50%" y="50%" fill="#007bff" dy=".3em">32x32</text></svg>
      <p class="pb-3 mb-0 small lh-sm border-bottom">
        <strong class="d-block text-gray-dark">{{message.theme}}</strong>
        {{message.body}}
      </p>
    </div>

    <small class="d-block text-end mt-3">
      <a href="{% url 'mailing:message_update' message.id %}" class="link-success">Редактировать</a>
      <a href="{% url 'mailing:message_delete' message.id %}" class="link-danger">Удалить</a>
      <a href="{% url 'mailing:message_list' %}">К списку сообщений</a>
    </small>
  </div>
{% endblock %}
